<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Context · Overlay Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Caveat:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  body { font-family: 'Kalam', sans-serif; color: #1a1612; }

  /* sketchy palette */
  :root {
    --ink: #1a1612;
    --ink-2: #4a423a;
    --paper: #fbfaf6;
    --paper-2: #ededeb;
    --line: #1a1612;
    --line-soft: rgba(26,22,18,.35);
    --line-faint: rgba(26,22,18,.18);
    --accent: #ff5a3c;       /* highlighter coral */
    --accent-soft: #ffd9d0;
    --dim: rgba(26,22,18,.45);
    --ghost: rgba(26,22,18,.28);
  }

  /* wireframe primitives */
  .wf, .wf * { font-family: 'Kalam', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; font-weight: 500; letter-spacing: -.02em; }
  .anno { font-family: 'Caveat', cursive; color: var(--dim); font-weight: 600; }

  /* sketchy borders — slightly jittery look via two-tone shadow */
  .sketch-box {
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    box-shadow: 2px 3px 0 var(--line);
  }
  .sketch-box-soft {
    background: var(--paper);
    border: 1.25px solid var(--line);
    border-radius: 12px;
    box-shadow: 1.5px 2px 0 rgba(26,22,18,.6);
  }
  .sketch-dashed {
    border: 1.25px dashed var(--line-soft);
    border-radius: 10px;
    background: transparent;
  }
  .hl { background: linear-gradient(180deg, transparent 55%, var(--accent-soft) 55% 92%, transparent 92%); padding: 0 3px; }
  .hl-strong { background: var(--accent); color: var(--paper); padding: 1px 7px; border-radius: 6px; }

  /* skeleton text bars */
  .bar { display: inline-block; height: 10px; background: var(--line-faint); border-radius: 4px; vertical-align: middle; }

  /* desktop context sketch behind each artboard (optional via tweak) */
  .desk {
    position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(135deg, transparent 0 18px, rgba(26,22,18,.04) 18px 19px);
  }
  .desk-browser {
    position: absolute; inset: 18px;
    border: 1.25px dashed var(--line-soft);
    border-radius: 8px;
    background: rgba(255,255,255,.5);
  }
  .desk-url {
    position: absolute; top: 30px; left: 60px; right: 30px; height: 22px;
    border: 1.25px solid var(--line-faint); border-radius: 11px;
    background: var(--paper);
  }
  .desk-traffic { position: absolute; top: 34px; left: 28px; display: flex; gap: 5px; }
  .desk-traffic span { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--line-soft); }
  .desk-cursor {
    position: absolute; right: 56px; top: 28px; width: 14px; height: 18px;
    background: var(--ink); clip-path: polygon(0 0, 100% 60%, 50% 65%, 70% 100%, 50% 100%, 35% 70%, 0 85%);
  }

  /* fake screen highlight ring (the part that lives on the screen, not the overlay) */
  .screen-highlight {
    position: absolute; border: 2px solid var(--accent);
    border-radius: 10px; box-shadow: 0 0 0 4px rgba(255,90,60,.18);
  }

  /* overlay shadow — sketchy, not rendered */
  .overlay-shadow { box-shadow: 4px 5px 0 rgba(26,22,18,.85); }

  /* the artboard inner stage */
  .stage {
    position: relative; width: 100%; height: 100%;
    background: var(--paper-2);
    overflow: hidden;
  }
  .stage.plain { background: var(--paper-2); }
  .stage.context { background: #e9e5dd; }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // EDITMODE tweak defaults — edited in place via the tweak panel + host
  window.__WF_DEFAULTS__ = /*EDITMODE-BEGIN*/{
    "state": "active",
    "showContext": true,
    "showInput": false,
    "showAnnotations": true
  }/*EDITMODE-END*/;
</script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
// Wireframe components — five directions for the Context tutorial overlay.
// All sketchy, low-fi. Each accepts { state, showInput, showAnnotations }.

const Icon = {
  // tiny lo-fi action icons
  Click: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||16} height={p.size||16} fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
      <path d="M9 3v6M5 5l2.5 2.5M3 9h6M5 13l2.5-2.5"/><path d="M11 11l8.5 3.2-3.6 1.5-1.5 3.6L11 11z"/>
    </svg>
  ),
  Type: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||16} height={p.size||16} fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
      <rect x="2.5" y="7" width="19" height="11" rx="2"/><path d="M6 11h.01M9 11h.01M12 11h.01M15 11h.01M18 11h.01M7 14.5h10"/>
    </svg>
  ),
  Key: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||16} height={p.size||16} fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h.01M11 9h.01M15 9h.01M19 9h.01M7 13h.01M19 13h.01M8 17h8"/>
    </svg>
  ),
  Pause: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||14} height={p.size||14} fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  ),
  Play: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||14} height={p.size||14} fill="currentColor"><path d="M7 5v14l12-7z"/></svg>
  ),
  Close: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||14} height={p.size||14} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  ),
  Book: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||14} height={p.size||14} fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
      <path d="M4 4h7a3 3 0 013 3v13a2 2 0 00-2-2H4z"/><path d="M20 4h-7a3 3 0 00-3 3v13a2 2 0 012-2h8z"/>
    </svg>
  ),
  Chevron: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||12} height={p.size||12} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  ),
  Mic: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||14} height={p.size||14} fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
  ),
  Sparkle: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||14} height={p.size||14} fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
  ),
};

// Tiny sketchy annotation arrow + caption
function Anno({ x, y, w, text, dir = 'left', rotate = 0 }) {
  return (
    <div className="anno" style={{
      position: 'absolute', left: x, top: y, width: w, fontSize: 18, lineHeight: 1.15,
      transform: `rotate(${rotate}deg)`, transformOrigin: 'top left',
    }}>
      {dir === 'left' && <span style={{ marginRight: 4 }}>↙</span>}
      {text}
      {dir === 'right' && <span style={{ marginLeft: 4 }}>↘</span>}
    </div>
  );
}

// Faux app behind the overlay
function DesktopContext({ kind = 'browser' }) {
  return (
    <>
      <div className="desk" />
      <div className="desk-browser">
        <div className="desk-traffic"><span/><span/><span/></div>
        <div className="desk-url" />
        <div className="desk-cursor" />
      </div>
    </>
  );
}

// Shared dot-row progress
function DotRow({ total = 12, current = 2, w = 6, gap = 4 }) {
  return (
    <div style={{ display: 'flex', gap, alignItems: 'center' }}>
      {Array.from({ length: total }).map((_, i) => (
        <span key={i} style={{
          width: i === current ? w + 2 : w, height: i === current ? w + 2 : w,
          borderRadius: '50%',
          background: i < current ? 'var(--ink)' : i === current ? 'var(--accent)' : 'transparent',
          border: i > current ? '1.25px solid var(--line-faint)' : i === current ? '1.5px solid var(--accent)' : '1.5px solid var(--ink)',
        }}/>
      ))}
    </div>
  );
}

// --------------------------------------------------------------------------
// V1 — PILL. Ultra-minimal one-line pill, instruction + dot progress.
// --------------------------------------------------------------------------
function V1_Pill({ state, showInput, showAnnotations }) {
  const paused = state === 'paused';
  const confirming = state === 'confirming';
  return (
    <div style={{ position: 'absolute', left: 60, top: 220, width: 360 }}>
      <div className="sketch-box overlay-shadow" style={{
        height: 56, borderRadius: 28, padding: '0 14px 0 14px',
        display: 'flex', alignItems: 'center', gap: 12,
        background: confirming ? 'var(--paper)' : 'var(--paper)',
        borderColor: confirming ? 'var(--accent)' : 'var(--line)',
        borderWidth: confirming ? 2 : 1.5,
      }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center',
          width: 28, height: 28, borderRadius: 14, border: '1.25px solid var(--line)', flex: '0 0 auto' }}>
          {paused ? <Icon.Play/> : confirming ? <Icon.Sparkle/> : <Icon.Click/>}
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          {confirming ? (
            <div style={{ fontSize: 15, fontWeight: 700 }}>
              Are you here? <span className="hl">Sign In page</span>
            </div>
          ) : (
            <div style={{ fontSize: 15, fontWeight: 700, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
              {paused ? <span style={{ color: 'var(--dim)' }}>Paused — tap to resume</span>
                      : <>Click <span className="hl">Sign In</span> in top-right</>}
            </div>
          )}
        </div>
        {confirming ? (
          <div style={{ display: 'flex', gap: 6 }}>
            <button className="mono" style={{ height: 26, padding: '0 10px', border: '1.25px solid var(--line)', borderRadius: 13, background: 'var(--paper)', fontSize: 12 }}>No</button>
            <button className="mono" style={{ height: 26, padding: '0 10px', border: 'none', borderRadius: 13, background: 'var(--accent)', color: 'var(--paper)', fontSize: 12, fontWeight: 600 }}>Yes</button>
          </div>
        ) : (
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, flex: '0 0 auto' }}>
            <DotRow total={12} current={2} />
          </div>
        )}
      </div>

      {/* drawer below — peek of last action */}
      <div style={{ marginTop: 8, padding: '4px 16px', fontSize: 13, color: 'var(--dim)', display: 'flex', justifyContent: 'space-between' }}>
        <span style={{ textDecoration: 'line-through' }}>✓ Open the address bar</span>
        <span className="mono" style={{ fontSize: 11 }}>3/12</span>
      </div>

      {showAnnotations && (
        <>
          <Anno x={-40} y={-26} w={140} text="single line · ellipsis if long" rotate={-2}/>
          <Anno x={250} y={70} w={140} dir="right" text="dots show progress at a glance" rotate={3}/>
        </>
      )}
    </div>
  );
}

// --------------------------------------------------------------------------
// V2 — SPOTLIGHT BAR. Wider command-bar style, inline controls + progress.
// --------------------------------------------------------------------------
function V2_Spotlight({ state, showInput, showAnnotations }) {
  const paused = state === 'paused';
  const confirming = state === 'confirming';
  return (
    <div style={{ position: 'absolute', left: 40, top: 200, width: 480 }}>
      <div className="sketch-box overlay-shadow" style={{
        borderRadius: 16, padding: 14, background: 'var(--paper)',
      }}>
        {/* top meta row */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
          <span className="mono" style={{ fontSize: 11, color: 'var(--dim)' }}>
            CONTEXT · Runpod Setup
          </span>
          <span className="mono" style={{ fontSize: 11, color: 'var(--dim)' }}>3/12</span>
        </div>
        {/* main row */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <div style={{ width: 36, height: 36, borderRadius: 10, border: '1.5px solid var(--line)',
            display: 'flex', alignItems: 'center', justifyContent: 'center', flex: '0 0 auto', background: 'var(--paper-2)' }}>
            {confirming ? <Icon.Sparkle size={18}/> : paused ? <Icon.Play size={18}/> : <Icon.Type size={18}/>}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 18, fontWeight: 700, lineHeight: 1.2 }}>
              {confirming ? <>Did you click <span className="hl">Sign In</span>?</>
               : paused ? <span style={{ color: 'var(--dim)' }}>Tutorial paused</span>
               : <>Type the <span className="hl">Runpod URL</span></>}
            </div>
          </div>
          <div style={{ display: 'flex', gap: 4, flex: '0 0 auto' }}>
            <BtnIcon><Icon.Book/></BtnIcon>
            <BtnIcon active={paused}>{paused ? <Icon.Play/> : <Icon.Pause/>}</BtnIcon>
            <BtnIcon><Icon.Close/></BtnIcon>
          </div>
        </div>
        {/* progress bar */}
        <div style={{ marginTop: 12, position: 'relative', height: 6 }}>
          <div style={{ position: 'absolute', inset: 0, border: '1.25px solid var(--line)', borderRadius: 3 }}/>
          <div style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: '22%', background: 'var(--accent)', borderRadius: 3 }}/>
        </div>

        {/* confirm row */}
        {confirming && (
          <div style={{ marginTop: 12, display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
            <button className="mono" style={{ height: 28, padding: '0 14px', border: '1.25px solid var(--line)', borderRadius: 8, background: 'var(--paper)', fontSize: 12 }}>Not yet</button>
            <button className="mono" style={{ height: 28, padding: '0 14px', border: 'none', borderRadius: 8, background: 'var(--accent)', color: 'var(--paper)', fontSize: 12, fontWeight: 600 }}>Yes, done</button>
          </div>
        )}

        {/* input — hidden behind toggle */}
        {showInput && !confirming && (
          <div style={{ marginTop: 10, display: 'flex', alignItems: 'center', gap: 8, padding: '8px 10px', borderRadius: 10, border: '1.25px dashed var(--line-soft)' }}>
            <Icon.Mic/>
            <span className="bar" style={{ width: '60%' }}/>
            <span style={{ marginLeft: 'auto', fontSize: 11, color: 'var(--dim)' }} className="mono">⏎</span>
          </div>
        )}
      </div>

      {showAnnotations && (
        <>
          <Anno x={-30} y={-26} w={170} text="title row tells you which tutorial" rotate={-2}/>
          <Anno x={350} y={-26} w={120} dir="right" text="x/12 lives here" rotate={2}/>
          <Anno x={350} y={70} w={130} dir="right" text="controls always visible" rotate={4}/>
        </>
      )}
    </div>
  );
}

function BtnIcon({ children, active }) {
  return (
    <button style={{
      width: 28, height: 28, borderRadius: 8,
      border: '1.25px solid var(--line)',
      background: active ? 'var(--accent)' : 'var(--paper)',
      color: active ? 'var(--paper)' : 'var(--ink)',
      display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
    }}>{children}</button>
  );
}

// --------------------------------------------------------------------------
// V3 — PEEK STACK. Just-did / Now / Up-next, three rows tightly stacked.
// --------------------------------------------------------------------------
function V3_PeekStack({ state, showInput, showAnnotations }) {
  const paused = state === 'paused';
  const confirming = state === 'confirming';
  return (
    <div style={{ position: 'absolute', left: 60, top: 180, width: 360 }}>
      <div className="sketch-box overlay-shadow" style={{ borderRadius: 14, padding: '10px 14px', background: 'var(--paper)' }}>
        {/* tiny header */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
          <span className="mono" style={{ fontSize: 11, color: 'var(--dim)' }}>STEP 3 / 12</span>
          <div style={{ display: 'flex', gap: 4 }}>
            <BtnIcon active={paused}>{paused ? <Icon.Play/> : <Icon.Pause/>}</BtnIcon>
            <BtnIcon><Icon.Close/></BtnIcon>
          </div>
        </div>

        {/* just did — dimmed */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '4px 0', opacity: .45 }}>
          <span className="mono" style={{ fontSize: 10 }}>✓</span>
          <span style={{ fontSize: 13, textDecoration: 'line-through' }}>Open the address bar</span>
        </div>

        {/* now — emphasized */}
        <div style={{
          margin: '4px -8px', padding: '10px 8px', borderRadius: 10,
          background: confirming ? 'transparent' : 'rgba(255,90,60,.10)',
          border: confirming ? '1.5px solid var(--accent)' : 'none',
          display: 'flex', alignItems: 'center', gap: 10,
        }}>
          <div style={{ width: 28, height: 28, borderRadius: 8, border: '1.25px solid var(--line)',
            display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--paper)', flex: '0 0 auto' }}>
            {confirming ? <Icon.Sparkle/> : <Icon.Type/>}
          </div>
          <div style={{ fontSize: 16, fontWeight: 700, lineHeight: 1.2 }}>
            {confirming ? <>Did you type the URL?</>
             : <>Type the <span className="hl">Runpod URL</span></>}
          </div>
        </div>

        {/* up next — ghosted */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '4px 0', color: 'var(--ghost)' }}>
          <span className="mono" style={{ fontSize: 10 }}>→</span>
          <span style={{ fontSize: 13 }}>Click Sign In in top-right</span>
        </div>

        {confirming && (
          <div style={{ marginTop: 6, display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
            <button className="mono" style={{ height: 26, padding: '0 12px', border: '1.25px solid var(--line)', borderRadius: 8, background: 'var(--paper)', fontSize: 11 }}>Not yet</button>
            <button className="mono" style={{ height: 26, padding: '0 12px', border: 'none', borderRadius: 8, background: 'var(--accent)', color: 'var(--paper)', fontSize: 11, fontWeight: 600 }}>Yes</button>
          </div>
        )}

        {showInput && !confirming && (
          <div style={{ marginTop: 8, display: 'flex', alignItems: 'center', gap: 8, padding: '6px 10px', borderRadius: 8, border: '1.25px dashed var(--line-soft)' }}>
            <span style={{ fontSize: 12, color: 'var(--dim)' }}>Ask…</span>
            <Icon.Mic/>
          </div>
        )}
      </div>

      {showAnnotations && (
        <>
          <Anno x={-30} y={70} w={130} text="just did (faded)" rotate={-3}/>
          <Anno x={-50} y={108} w={140} text="NOW — accent fill" rotate={-2}/>
          <Anno x={-30} y={158} w={130} text="up next (ghost)" rotate={-3}/>
        </>
      )}
    </div>
  );
}

// --------------------------------------------------------------------------
// V4 — PROGRESS RING. Compact square w/ big ring; tutorial feels like a quest.
// --------------------------------------------------------------------------
function V4_Ring({ state, showInput, showAnnotations }) {
  const paused = state === 'paused';
  const confirming = state === 'confirming';
  // ring values
  const r = 30, c = 2 * Math.PI * r;
  const pct = confirming ? 0.18 : paused ? 0.18 : 0.22;
  return (
    <div style={{ position: 'absolute', left: 80, top: 130, width: 280 }}>
      <div className="sketch-box overlay-shadow" style={{ borderRadius: 16, padding: 16, background: 'var(--paper)' }}>
        {/* top — small controls only */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
          <span className="mono" style={{ fontSize: 11, color: 'var(--dim)' }}>RUNPOD SETUP</span>
          <div style={{ display: 'flex', gap: 4 }}>
            <BtnIcon><Icon.Book/></BtnIcon>
            <BtnIcon><Icon.Close/></BtnIcon>
          </div>
        </div>

        <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginTop: 8 }}>
          {/* ring */}
          <div style={{ position: 'relative', width: 72, height: 72, flex: '0 0 auto' }}>
            <svg width="72" height="72" viewBox="0 0 72 72">
              <circle cx="36" cy="36" r={r} fill="none" stroke="var(--line-faint)" strokeWidth="4"/>
              <circle cx="36" cy="36" r={r} fill="none" stroke="var(--accent)" strokeWidth="4"
                strokeDasharray={`${c * pct} ${c}`} strokeLinecap="round"
                transform="rotate(-90 36 36)"/>
            </svg>
            <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
              <span className="mono" style={{ fontSize: 18, fontWeight: 700, lineHeight: 1 }}>3</span>
              <span className="mono" style={{ fontSize: 10, color: 'var(--dim)', marginTop: 1 }}>of 12</span>
            </div>
          </div>
          {/* text */}
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 11, color: 'var(--dim)' }} className="mono">CURRENT STEP</div>
            <div style={{ fontSize: 16, fontWeight: 700, lineHeight: 1.2, marginTop: 2 }}>
              {confirming ? <>Are you on Sign In?</>
               : paused ? <span style={{ color: 'var(--dim)' }}>Paused</span>
               : <>Type the <span className="hl">Runpod URL</span></>}
            </div>
          </div>
        </div>

        {/* bottom action row */}
        <div style={{ marginTop: 12, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          {confirming ? (
            <div style={{ display: 'flex', gap: 6, width: '100%' }}>

// Hybrid wireframes — Peek stack + Action chip fused with Q&A.

// shared bits ────────────────────────────────────────────────────────────────

function Chrome({ children, accent }) {
  // outer overlay shell
  return (
    <div className="sketch-box overlay-shadow" style={{
      background: 'var(--paper)',
      borderRadius: 14,
      borderColor: accent ? 'var(--accent)' : 'var(--line)',
      borderWidth: accent ? 2 : 1.5,
      overflow: 'hidden',
    }}>
      {children}
    </div>
  );
}

function StepRow({ state, text, action, highlight }) {
  // state: 'done' | 'now' | 'next' | 'asked'
  const opacity = state === 'done' ? .45 : state === 'next' ? .35 : 1;
  const td = state === 'done' ? 'line-through' : 'none';
  const bg = state === 'now' ? 'rgba(255,90,60,.10)' : 'transparent';
  const fw = state === 'now' ? 700 : 500;
  const fs = state === 'now' ? 16 : 13;
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 10,
      padding: state === 'now' ? '10px 10px' : '4px 10px',
      margin: state === 'now' ? '4px -2px' : '0',
      borderRadius: state === 'now' ? 10 : 0,
      background: bg, opacity,
    }}>
      <span className="mono" style={{ fontSize: 11, width: 16, textAlign: 'center', color: 'var(--dim)' }}>
        {state === 'done' ? '✓' : state === 'now' ? '●' : '→'}
      </span>
      <span style={{ fontSize: fs, fontWeight: fw, lineHeight: 1.25, textDecoration: td }}>
        {highlight ? <>{text.split(highlight)[0]}<span className="hl">{highlight}</span>{text.split(highlight)[1]}</> : text}
      </span>
    </div>
  );
}

function HeaderBar({ step = '3 / 12', label = 'RUNPOD SETUP', paused, children }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '10px 12px 8px', borderBottom: '1px solid var(--line-faint)',

        <span className="mono" style={{ fontSize: 11, color: 'var(--ink)', fontWeight: 600 }}>{step}</span>
      </div>
      <div style={{ display: 'flex', gap: 4 }}>
        {children || (
          <>
            <BtnIcon><Icon.Book/></BtnIcon>
            <BtnIcon active={paused}>{paused ? <Icon.Play/> : <Icon.Pause/>}</BtnIcon>
            <BtnIcon><Icon.Close/></BtnIcon>
          </>
        )}
      </div>
    </div>
  );
}

function ThinProgress({ pct = 0.22 }) {
  return (
    <div style={{ height: 3, background: 'var(--line-faint)', position: 'relative' }}>
      <div style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: (pct*100)+'%', background: 'var(--accent)' }}/>

}

  return (
